# JReleaser is only the uploader and bundler. Projects register one archive per module and version
# under registry/; scripts/stage.py extracts the pending ones into `staging`, and JReleaser merges
# that directory into one zip, ignores hidden files and maven-metadata.xml, checks every POM against
# repo1 before uploading, and creates at most one Central deployment per run.
project:
  name: maven-central-publishing
  # No version here: it is read from JRELEASER_PROJECT_VERSION, which the workflow sets per run.
  # It only affects the bundle file name.
  languages:
    java:
      groupId: io.github.shijianjs

deploy:
  maven:
    mavenCentral:
      hub:
        # The deferral to the upload job is handled by the workflow, not by disabling this block:
        # the bundle-building dry run needs the deployer to be enabled.
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        # BASIC means "Bearer base64(username:password)", which is what a Central user token is.
        authorization: BASIC
        # Username and password are read from
        # JRELEASER_DEPLOY_MAVEN_MAVENCENTRAL_HUB_USERNAME / ..._PASSWORD.
        # They are only set in the upload job; dry runs pass dummy values.
        stagingRepositories:
          - staging
        # JReleaser would otherwise generate .md5/.sha1/.sha256/.sha512 for every artifact. Central
        # validates only .md5 and .sha1, and scripts/stage.py writes exactly that pair into
        # staging after the merge, so letting JReleaser add its four copies would only double the
        # File Count cost.
        checksums: false
        # Artifacts are signed by the producing project. Signing them again would not change what
        # Central validates.
        sign: false
        # Kotlin Multiplatform JS publications declare `<packaging>klib</packaging>` and ship a
        # `.klib`, which Central accepts (kotlinx libraries publish exactly this) but JReleaser's
        # PomChecker (kordamp) rejects with "Unknown packaging: klib". The checks that matter are
        # already done by scripts/stage.py (POM present, every file signed, coordinates match), and
        # Central validates the POM again on upload.
        verifyPom: false
        # JReleaser treats every packaging other than pom/aar/war/zip as requiring a `.jar`, which a
        # klib coordinate does not have. `jar: false` is the only switch for it and it matches by
        # exact artifactId, so every `*-js` coordinate of every producer must be listed here.
        artifactOverrides:
          - groupId: io.github.shijianjs
            artifactId: ktjs-iconify-types-js
            jar: false
          - groupId: io.github.shijianjs
            artifactId: ktjs-iconify-utils-js
            jar: false
          - groupId: io.github.shijianjs
            artifactId: ktjs-iconify-tools-js
            jar: false
          - groupId: io.github.shijianjs
            artifactId: ktjs-iconify-icon-js
            jar: false
          - groupId: io.github.shijianjs
            artifactId: ktjs-vaadin-web-components-js
            jar: false
          - groupId: io.github.shijianjs
            artifactId: ktjs-echarts-js
            jar: false
          - groupId: io.github.shijianjs
            artifactId: ktjs-echarts-gl-js
            jar: false
